<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTS · Nai Tnuocca Secivres</title>
<style>
  :root {
    --bg-center: #05214f;
    --bg-edge: #010a1f;
    --edge-light: #a9d4ff;
    --text-dim: #8fb2e6;
    --blue: #0a8dff;
    --violet: #7b2ff7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 40% at 50% 108%, rgba(123, 47, 247, .45), transparent 70%),
      radial-gradient(ellipse 45% 30% at 18% 100%, rgba(10, 141, 255, .30), transparent 70%),
      radial-gradient(ellipse at 50% 42%, var(--bg-center) 0%, var(--bg-edge) 75%);
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 900;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1000px;
    height: 420px;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
  }

  .glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 720px;
    height: 320px;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(10, 141, 255, .22), rgba(123, 47, 247, .08) 60%, transparent);
    filter: blur(10px);
    pointer-events: none;
  }

  /* ---------- Linha do logótipo ---------- */
  .logo {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 280px;
    line-height: 1;
    gap: 0;
    white-space: nowrap;
    perspective: 1400px;
  }

  .word {
    display: flex;
    align-items: center;
  }

  /* ---------- Texto metálico com extrusão ---------- */
  .m {
    position: relative;
    display: inline-block;
    padding-right: .04em;
    color: #050d22;
    -webkit-text-stroke: .028em var(--edge-light);
    text-shadow:
      .012em .012em 0 #1b3d78,
      .024em .024em 0 #173368,
      .036em .036em 0 #122a58,
      .048em .048em 0 #0e2249,
      .060em .060em 0 #0a1a3a,
      .075em .095em .06em rgba(0, 4, 20, .6),
      0 0 .25em rgba(10, 141, 255, .45);
  }

  .m::after {
    content: attr(data-t);
    position: absolute;
    left: 0;
    top: 0;
    padding-right: .04em;
    color: transparent;
    -webkit-text-stroke: .028em var(--edge-light);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: none;
  }

  /* alumínio escovado cinzento escuro + brilho que passa */
  .m::after,
  .cap.inner,
  .side {
    background:
      linear-gradient(105deg, transparent 42%, rgba(190, 225, 255, .6) 50%, transparent 58%) no-repeat,
      repeating-linear-gradient(0deg, rgba(190, 225, 255, .09) 0 1px, rgba(0, 5, 25, .16) 1px 2px),
      linear-gradient(120deg, #0b1a3a 0%, #2d5496 22%, #12275a 38%, #4f82d6 52%, #10224d 68%, #2a4b8f 84%, #0b1a3a 100%);
    background-size: 60% 100%, auto, 100% 100%;
    background-position: -150% 0, 0 0, 0 0;
    animation: glint 2.8s ease-in-out infinite;
  }
  .m::after {
    -webkit-background-clip: text;
    background-clip: text;
  }

  @keyframes glint {
    0%   { background-position: -150% 0, 0 0, 0 0; }
    60%  { background-position: 250% 0, 0 0, 0 0; }
    100% { background-position: 250% 0, 0 0, 0 0; }
  }

  /* estados iniciais (a animar por JS) */
  .head.side-n, .head.side-s { width: 0; opacity: 0; }
  .rest {
    width: 0;
    opacity: 0;
    clip-path: inset(-.4em 0 -.4em 0);
  }

  /* ---------- T em 3D ---------- */
  .tslot {
    position: relative;
    width: 200px;
    height: 200px;
    flex: none;
  }
  .tscale {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform: scale(1);
    perspective: 900px;
    opacity: 0;
    filter: drop-shadow(0 0 18px rgba(10, 141, 255, .4));
  }
  .enter, .sway, .spin {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .enter { transform: scale(.55); }
  .sway { animation: sway 4.5s ease-in-out infinite alternate; }
  .spin { transform: rotateZ(-90deg); }

  @keyframes sway {
    from { transform: rotateX(16deg) rotateY(-30deg); }
    to   { transform: rotateX(9deg)  rotateY(12deg); }
  }

  .cap {
    position: absolute;
    left: -100px;
    top: -100px;
    width: 200px;
    height: 200px;
    backface-visibility: hidden;
  }
  .cap.outer {
    background: linear-gradient(135deg, #d4eaff 0%, #5f94d6 50%, #b5d8ff 100%);
  }
  .side {
    position: absolute;
    border-top: 2px solid #7fb2ee;
    border-bottom: 2px solid #7fb2ee;
  }

  /* ---------- Assinatura ---------- */
  .credit {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: .14em;
    color: var(--text-dim);
    opacity: 0;
  }

  #meas {
    position: absolute;
    left: -9999px;
    top: 0;
    visibility: hidden;
    font-size: 100px;
  }

  @media (prefers-reduced-motion: reduce) {
    .sway, .m::after, .cap.inner, .side { animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="glow"></div>

  <div class="logo" id="logo">
    <span class="word" id="w1">
      <span class="m head side-n" id="h1" data-t="N">N</span><span class="m rest" id="r1" data-t="ai">ai</span>
    </span>
    <span class="word" id="w2">
      <span class="tslot" id="tslot">
        <span class="tscale" id="tscale">
          <span class="enter" id="enter"><span class="sway"><span class="spin" id="spin"></span></span></span>
        </span>
      </span><span class="m rest" id="r2" data-t="nuocca">nuocca</span>
    </span>
    <span class="word" id="w3">
      <span class="m head side-s" id="h3" data-t="S">S</span><span class="m rest" id="r3" data-t="ecivres">ecivres</span>
    </span>
  </div>

  <div class="credit" id="credit">NTS | By Ian Longo</div>
</div>

<span class="m" id="meas">x</span>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), logo = $('logo'), spin = $('spin'),
        enter = $('enter'), tscale = $('tscale'), tslot = $('tslot'),
        h1 = $('h1'), h3 = $('h3'), r1 = $('r1'), r2 = $('r2'), r3 = $('r3'),
        w1 = $('w1'), w2 = $('w2'), w3 = $('w3'), credit = $('credit'), meas = $('meas');

  /* ---------- ajustar ao ecrã ---------- */
  function fit() {
    const s = Math.min(innerWidth / 1000, innerHeight / 520, 1.15);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ---------- construir o T em 3D (extrusão) ---------- */
  const D = 44; // profundidade
  const P  = [[0,0],[200,0],[200,56],[128,56],[128,200],[72,200],[72,56],[0,56]];
  const IN = [[6,6],[194,6],[194,50],[122,50],[122,194],[78,194],[78,50],[6,50]];
  const poly = a => 'polygon(' + a.map(p => p[0] + 'px ' + p[1] + 'px').join(',') + ')';

  function cap(cls, pts, z, back) {
    const e = document.createElement('span');
    e.className = 'cap ' + cls;
    e.style.clipPath = poly(pts);
    e.style.webkitClipPath = poly(pts);
    e.style.transform = back ? `rotateY(180deg) translateZ(${z}px)` : `translateZ(${z}px)`;
    spin.appendChild(e);
  }
  cap('outer', P, D / 2, false);
  cap('inner', IN, D / 2 + .6, false);
  cap('outer', P, D / 2, true);
  cap('inner', IN, D / 2 + .6, true);

  P.forEach((a, i) => {
    const b = P[(i + 1) % P.length];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy);
    const mx = (a[0] + b[0]) / 2 - 100, my = (a[1] + b[1]) / 2 - 100;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const s = document.createElement('span');
    s.className = 'side';
    s.style.width = L + 'px';
    s.style.height = D + 'px';
    s.style.left = (-L / 2) + 'px';
    s.style.top = (-D / 2) + 'px';
    s.style.transform = `translate3d(${mx}px, ${my}px, 0) rotateZ(${ang}deg) rotateX(90deg)`;
    s.style.filter = `brightness(${(.55 + .45 * Math.abs(Math.cos((ang - 35) * Math.PI / 180))).toFixed(2)})`;
    spin.appendChild(s);
  });

  /* ---------- utilitários ---------- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const EASE = 'cubic-bezier(.22,.8,.2,1)';

  function anim(el, kf, dur, easing = EASE, delay = 0) {
    const a = el.animate(kf, { duration: dur, easing, delay, fill: 'both' });
    return a.finished.then(() => {
      try { a.commitStyles(); } catch (e) {}
      a.cancel();
    });
  }

  function setM(el, t) { el.textContent = t; el.dataset.t = t; }

  // largura de um texto, em "em"
  function em(text) {
    meas.textContent = text;
    return meas.getBoundingClientRect().width / 100;
  }

  /* ---------- sequência ---------- */
  async function run() {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    const FS_BIG = 140, FS_END = 60, T_END = FS_END * 0.72;
    const wN = em('N'), wS = em('S');
    const wR1 = em('ai'), wR2 = em('nuocca'), wR3 = em('ecivres');

    /* 1. O T aparece "deitado" para a esquerda */
    await Promise.all([
      anim(tscale, [{ opacity: 0 }, { opacity: 1 }], 600, 'ease-out'),
      anim(enter, [{ transform: 'scale(.55)' }, { transform: 'scale(1)' }], 700, 'cubic-bezier(.2,.9,.25,1.15)')
    ]);
    await sleep(300);

    /* 2. Gira pelas 4 posições: esquerda → pernas para o ar → direita → normal */
    const steps = [[-90, -180], [-180, -270], [-270, -360]];
    for (const [a, b] of steps) {
      await anim(spin,
        [{ transform: `rotateZ(${a}deg)` }, { transform: `rotateZ(${b}deg)` }],
        560, 'cubic-bezier(.55,.05,.25,1.18)');
      await sleep(220);
    }
    await sleep(200);

    /* 3. T encolhe e surgem o N e o S: NTS */
    const dB = 800;
    await Promise.all([
      anim(logo, [{ fontSize: '280px' }, { fontSize: FS_BIG + 'px' }], dB),
      anim(tslot, [{ width: '200px', height: '200px' }, { width: '100px', height: '100px' }], dB),
      anim(tscale, [{ transform: 'scale(1)' }, { transform: 'scale(.5)' }], dB),
      anim(h1, [
        { width: '0px', opacity: 0, transform: 'translateX(60px)' },
        { width: (wN * FS_BIG) + 'px', opacity: 1, transform: 'translateX(0px)' }
      ], dB),
      anim(h3, [
        { width: '0px', opacity: 0, transform: 'translateX(-60px)' },
        { width: (wS * FS_BIG) + 'px', opacity: 1, transform: 'translateX(0px)' }
      ], dB)
    ]);
    await sleep(500);

    /* 4. NTS expande e dá espaço a "Nai Tnuocca Secivres" */
    const dC = 1000;
    const grow = (r, w, delay) => anim(r,
      [{ width: '0px', opacity: 0 }, { width: (w * FS_END) + 'px', opacity: 1 }],
      dC - 150, EASE, delay);
    await Promise.all([
      anim(logo, [{ fontSize: FS_BIG + 'px', gap: '0px' }, { fontSize: FS_END + 'px', gap: '30px' }], dC),
      anim(tslot, [{ width: '100px', height: '100px' }, { width: T_END * 1.15 + 'px', height: T_END * 1.15 + 'px' }], dC),
      anim(tscale, [{ transform: 'scale(.5)' }, { transform: `scale(${(T_END * 1.15 / 200).toFixed(4)})` }], dC),
      anim(h1, [{ width: (wN * FS_BIG) + 'px' }, { width: (wN * FS_END) + 'px' }], dC),
      anim(h3, [{ width: (wS * FS_BIG) + 'px' }, { width: (wS * FS_END) + 'px' }], dC),
      grow(r1, wR1, 150), grow(r2, wR2, 0), grow(r3, wR3, 300)
    ]);
    [r1, r2, r3].forEach(r => { r.style.clipPath = 'none'; });
    await sleep(600);

    /* 5. As palavras viram e ficam: Services account Ian */
    const flipOut = w => anim(w, [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], 340, 'ease-in');
    const flipIn  = w => anim(w, [{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], 340, 'ease-out');
    await Promise.all([w1, w2, w3].map(flipOut));

    // troca de conteúdo enquanto as palavras estão de lado
    setM(h1, 'I');       h1.style.width = (em('I') * FS_END) + 'px';
    setM(r1, 'an');      r1.style.width = (em('an') * FS_END) + 'px';
    tslot.style.display = 'none';
    setM(r2, 'Account'); r2.style.width = (em('Account') * FS_END) + 'px';
    setM(h3, 'S');       h3.style.width = (em('S') * FS_END) + 'px';
    setM(r3, 'ervices'); r3.style.width = (em('ervices') * FS_END) + 'px';

    await Promise.all([w1, w2, w3].map(flipIn));

    /* 6. Assinatura */
    await anim(credit, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }], 700, 'ease-out');

    /* 7. Passa para a página de autenticação, mantendo parâmetros SSO */
    await sleep(900);
    await anim(stage, [{ opacity: 1 }, { opacity: 0 }], 350, 'ease-in');
    // Preserva ?redirect_to= e outros params SSO caso venham do sso-client.js
    location.replace('auth.html' + window.location.search);
  }

  run();
})();
</script>
</body>
</html>
